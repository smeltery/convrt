    <path d="M64 551h1074" stroke="#e1e2dc"/>
    <circle cx="69" cy="584" r="4" fill="#82906d"/>
    <text x="83" y="589" font-size="14" fill="#6d7069">No uploads. No account. Just your files.</text>
    <text x="1138" y="589" text-anchor="end" font-size="14" fill="#6d7069">Finder Quick Action + CLI</text>
