<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>convrt — new format, same file, same Mac.</title>
  <desc>Convert files with a right-click. A Finder illustration shows a PNG image becoming WebP, locally on your Mac.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#373d33" flood-opacity=".1"/>
    </filter>
    <filter id="menu-shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#313929" flood-opacity=".13"/>
    </filter>
    <symbol id="landscape" viewBox="0 0 180 128">
      <rect width="180" height="128" fill="#e5e4e0"/>
      <circle cx="130" cy="34" r="16" fill="#faf9f6"/>
      <path d="M0 107 59 32l54 71 33-42 34 43v24H0Z" fill="#a7aaa3"/>
      <path d="m59 32 19 25-13-3-8 10-12-14Z" fill="#f5f5f0"/>
