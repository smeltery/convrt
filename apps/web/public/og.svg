    <text x="1138" y="78" text-anchor="end" font-size="14" fill="#6d7069">A little utility. A lot less friction.</text>
    <text x="62" y="214" font-size="70" font-weight="600" letter-spacing="-3.5">New format.</text>
    <g font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="76" letter-spacing="-3.8">
      <text x="60" y="293">Same file.</text>
      <text x="60" y="372">Same Mac.</text>
    </g>
    <text x="64" y="430" font-size="21" fill="#6d7069">Convert your files with a right-click.</text>
