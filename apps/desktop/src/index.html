<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>convrt — Local conversion</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header><span class="brand">convrt</span><span class="badge">ON YOUR DEVICE</span></header>
    <h1>New format.<br>Same file. Same device.</h1>
    <p>Your files stay here. Choose a format and we’ll save a new copy.</p>
    <section id="drop"><button type="button" id="pick">Choose files</button> <button type="button" id="folders">Choose folders</button><p>or drop files here</p><ul id="files"></ul></section>
    <div class="fields">
      <label>Convert to<select id="target" aria-label="Target format"></select></label>
      <label>Preset<select id="preset"><option value="">Custom</option><option value="web">Web image</option><option value="thumbnail">Thumbnail</option><option value="video">Video</option><option value="audio">Audio</option></select></label>
      <label>Quality<input id="quality" type="number" min="1" max="100" value="82"></label>
      <label>Max width<input id="width" type="number" min="1" placeholder="Original"></label>
      <label>PDF pages<input id="pages" placeholder="1,3-5"></label>
      <label>PDF DPI<input id="dpi" type="number" min="1" max="1200" value="150"></label>
    </div>
    <details class="advanced"><summary>More options</summary>
      <div class="fields">
        <label>Max height<input id="height" type="number" min="1" max="16384" placeholder="Original"></label>
        <label>Parallel jobs<input id="jobs" type="number" min="1" max="32" value="1"></label>
        <label>Frame rate<input id="fps" type="number" min="1" max="240" placeholder="Original"></label>
        <label>Start (seconds)<input id="start" type="number" min="0" step="0.1" placeholder="0"></label>
        <label>Duration (seconds)<input id="duration" type="number" min="0.001" step="0.1" placeholder="Full length"></label>
      </div>
      <label class="check"><input id="recursive" type="checkbox">Include subfolders</label>
      <label class="check"><input id="mute" type="checkbox">Remove video audio</label>
      <label class="check"><input id="overwrite" type="checkbox">Replace existing output files</label>
    </details>
    <div class="actions"><button type="button" id="directory">Choose output folder</button><span id="destination">Next to originals</span><button type="button" id="reset-directory">Reset</button></div>
    <button type="button" id="convert" disabled>Convert files</button>
    <p id="status" role="status" aria-live="polite"></p>
    <details><summary>Conversion engines</summary><pre id="engines"></pre></details>
  </main>
  <script src="controls.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
