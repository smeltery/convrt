name: desktop

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "packages/core/**"
      - "integrations/**"
      - "bun.lock"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: package ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run --filter @convrt/desktop package --dir
      - run: bun apps/desktop/scripts/smoke.ts
      - name: Check Explorer registration
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Executable = (Get-ChildItem apps/desktop/release -Filter convrt.exe -Recurse | Select-Object -First 1).FullName
          ./integrations/windows/install.ps1 -Executable $Executable
          $Key = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Software\Classes\*\shell\convrt\command')
          try {
            if ($Key.GetValue('') -ne ('"' + $Executable + '" "%1"')) { throw 'Invalid Explorer command' }
          } finally {
            if ($Key) { $Key.Dispose() }
            ./integrations/windows/uninstall.ps1
          }
      - name: Check Linux registration
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export XDG_DATA_HOME="$RUNNER_TEMP/convrt-shell-test"
          executable="$(realpath apps/desktop/release/linux-unpacked/convrt)"
          bash integrations/linux/install.sh "$executable"
          test -f "$XDG_DATA_HOME/applications/convrt.desktop"
          bash -n "$XDG_DATA_HOME/nautilus/scripts/Convert with convrt"
          bash integrations/linux/uninstall.sh
          test ! -e "$XDG_DATA_HOME/applications/convrt.desktop"
