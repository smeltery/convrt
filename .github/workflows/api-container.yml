name: API container

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/api/**"
      - "packages/core/**"
      - "packages/sdk/**"
      - "deploy/api/**"
      - "bun.lock"
      - ".dockerignore"
      - ".github/workflows/api-container.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.13
      - name: Build and verify durable jobs
        shell: bash
        run: |
          export CONVRT_API_KEYS
          CONVRT_API_KEYS="$(openssl rand -hex 32)"
          compose=(docker compose -p convrt-api-ci -f deploy/api/compose.yaml)
          trap '"${compose[@]}" down --volumes' EXIT
          "${compose[@]}" up --build --wait --wait-timeout 180
          bun apps/api/scripts/smoke.ts
          "${compose[@]}" restart api
          "${compose[@]}" up --wait --wait-timeout 60
          bun apps/api/scripts/smoke.ts --verify-restart
