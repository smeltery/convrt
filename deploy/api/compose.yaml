services:
  api:
    build:
      context: ../..
      dockerfile: deploy/api/Dockerfile
    environment:
      CONVRT_API_KEYS: ${CONVRT_API_KEYS:?Set at least one random API key of 32 or more characters}
    volumes:
      - jobs:/data
    networks:
      - conversion
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    stop_grace_period: 130s
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:8787/health'); process.exit(r.ok ? 0 : 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
  gateway:
    image: nginx:1.28-alpine
    user: "101:101"
    ports:
      - "127.0.0.1:${CONVRT_PORT:-8787}:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - conversion
      - edge
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
networks:
  conversion:
    internal: true
  edge:
volumes:
  jobs:
