schema-version = "1.16.0"

[install]
bun.pkg-path = "bun"
bun.version = "1.3.13"
git.pkg-path = "git"
git.outputs = "all"
gh.pkg-path = "gh"
pre-commit.pkg-path = "pre-commit"
pre-commit.outputs = "all"
actionlint.pkg-path = "actionlint"
shellcheck.pkg-path = "shellcheck"
shellcheck.outputs = "all"
ffmpeg.pkg-path = "ffmpeg"
ffmpeg.pkg-group = "engines"
poppler_utils.pkg-path = "poppler_utils"
poppler_utils.pkg-group = "engines"

[hook]
on-activate = '''
  if [ "${CI:-}" != "true" ] && [ ! -d "$FLOX_ENV_PROJECT/node_modules" ]; then
    echo "convrt: installing dependencies (first activation)…" >&2
    (cd "$FLOX_ENV_PROJECT" && bun install --frozen-lockfile)
  fi
  if [ "${CI:-}" != "true" ] && [ -f "$FLOX_ENV_PROJECT/.pre-commit-config.yaml" ]; then
    (cd "$FLOX_ENV_PROJECT" && command -v pre-commit >/dev/null && pre-commit install --install-hooks >/dev/null 2>&1 || true)
  fi
  echo "convrt ready — bun $(bun --version 2>/dev/null || echo '?') · bun run ci"
'''

[options]
systems = ["aarch64-darwin", "x86_64-darwin", "aarch64-linux", "x86_64-linux"]
